name: Trigger Deploy in personal-infra
on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "webpack.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch deploy-nobuffer-site to personal-infra
    runs-on: ubuntu-latest
    steps:
    - name: Send repository_dispatch event
      env:
        GH_TOKEN: ${{ secrets.PERSONAL_INFRA_TOKEN || secrets.METRICS_TOKEN }}
      run: |
        gh api repos/vitorecomp/personal-infra/dispatches \
          --method POST \
          -f event_type="deploy-nobuffer-site" \
          -f "client_payload[sha]=${{ github.sha }}"
